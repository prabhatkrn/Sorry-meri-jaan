<style>
body {
  margin: 0;

/* Password Screen */
#lockScreen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: linear-gradient(to bottom right, #ff758c, #ff7eb3);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

input {
  padding: 10px;
  font-size: 18px;
  border-radius: 20px;
  border: none;
  text-align: center;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  font-size: 18px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
}

#mainContent {
  display: none;
}

.container {
  margin-top: 15%;
  padding: 20px;
  position: relative;
  z-index: 2;
}

#typing {
  font-size: 20px;
  max-width: 700px;
  margin: 20px auto;
  white-space: pre-line;
}

/* Floating */
.floating {
  position: absolute;
  animation: float linear infinite;
}

@keyframes float {
  0% { transform: translateY(100vh); opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

/* Heart burst */
.heart {
  position: absolute;
  font-size: 20px;
  animation: burst 1s ease-out forwards;
}

@keyframes burst {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: translateY(-100px) scale(2); opacity: 0; }
}
</style>
</head>

<body>

<!-- 🔐 Password Screen -->
<div id="lockScreen">
  <h2>Enter Password ❤️</h2>
  <input type="password" id="passwordInput" placeholder="Enter password">
  <button onclick="checkPassword()">Unlock 💌</button>
  <p id="error" style="color:yellow;"></p>
</div>

<!-- 🎵 Background Music -->
<audio id="bgMusic" loop>
  <source src="lonely.mp3" type="audio/mp3">

<div id="mainContent">

const correctPassword = "14052007";

function checkPassword() {
  const input = document.getElementById("passwordInput").value;
  if (input === correctPassword) {
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("mainContent").style.display = "block";
    document.getElementById("bgMusic").play();
    startTyping();

  } else {
    document.getElementById("error").innerText = "Wrong password 😢";
  }
}

let i = 0;
function startTyping() {
  function typeWriter() {
    if (i < text.length) {
      document.getElementById("typing").innerHTML += text.charAt(i);
      i++;
      setTimeout(typeWriter, 50);
    }
  }
  typeWriter();
}

/* No Button Move */
function moveNo() {
  var btn = document.getElementById("noBtn");
  btn.style.position = "absolute";
  btn.style.top = Math.random() * window.innerHeight + "px";
  btn.style.left = Math.random() * window.innerWidth + "px";
}

/* Yes Click Effect */
function yesClicked() {
  alert("Yayyy ❤️ I love you 😘");
  for (let i = 0; i < 20; i++) {
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "heart";
    heart.style.left = (window.innerWidth/2 + Math.random()*100 - 50) + "px";
    heart.style.top = (window.innerHeight/2) + "px";
    document.body.appendChild(heart);
  }
}

/* Floating items */
function startFloating() {
  for (let i = 0; i < 30; i++) {
    let item = document.createElement("div");
    item.innerHTML = Math.random() > 0.5 ? "🌸" : "💗";
    item.className = "floating";
    item.style.left = Math.random() * 100 + "vw";
    item.style.animationDuration = (5 + Math.random() * 5) + "s";
    document.body.appendChild(item);
  }
}
